y:0}46.250%,70.859%{opacity:1}71.016%{opacity:0}100%{opacity:0}}.act1{animation:act1 12.8s linear infinite}@keyframes act2{0%{opacity:0}71.094%{opacity:0}71.250%,95.859%{opacity:1}96.016%{opacity:0}100%{opacity:0}}.act2{animation:act2 12.8s linear infinite}@keyframes act3{0%{opacity:0}96.094%{opacity:0}96.250%,120.859%{opacity:1}100.000%{opacity:0}100%{opacity:0}}.act3{animation:act3 12.8s linear infinite}@keyframes chip0{0%{opacity:0}92.344%{opacity:0}92.500%,99.609%{opacity:1}99.766%{opacity:0}100%{opacity:0}}.chip0{animation:chip0 12.8s linear infinite}@keyframes chip1{0%{opacity:0}42.344%{opacity:0}42.500%,49.609%{opacity:1}49.766%{opacity:0}100%{opacity:0}}.chip1{animation:chip1 12.8s linear infinite}@keyframes chip4{0%{opacity:0}17.344%{opacity:0}17.500%,24.609%{opacity:1}24.766%{opacity:0}67.344%{opacity:0}67.500%,74.609%{opacity:1}74.766%{opacity:0}100%{opacity:0}}.chip4{animation:chip4 12.8s linear infinite}@keyframes why0{0%{opacity:0}17.344%{opacity:0}17.500%,24.609%{opacity:1}24.766%{opacity:0}100%{opacity:0}}.why0{animation:why0 12.8s linear infinite}@keyframes why1{0%{opacity:0}42.344%{opacity:0}42.500%,49.609%{opacity:1}49.766%{opacity:0}100%{opacity:0}}.why1{animation:why1 12.8s linear infinite}@keyframes why2{0%{opacity:0}67.344%{opacity:0}67.500%,74.609%{opacity:1}74.766%{opacity:0}100%{opacity:0}}.why2{animation:why2 12.8s linear infinite}@keyframes why3{0%{opacity:0}92.344%{opacity:0}92.500%,99.609%{opacity:1}99.766%{opacity:0}100%{opacity:0}}.why3{animation:why3 12.8s linear infinite}
