<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs>
<rect width="1000" height="340" rx="12" fill="#0d1117"/>
<text x="25" y="36" style="font:700 18px system-ui,-apple-system,'Segoe UI',sans-serif" fill="#c9d1d9">How each bot spends its slots</text>
<rect x="25" y="58" width="215" height="92" rx="10" fill="#161b22" stroke="#30363d"/>
<rect class="box0" x="25" y="58" width="215" height="92" rx="10" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
<text x="41" y="88" class="h">1  Wait</text>
<text x="41" y="110" class="s">3000 ms + margin</text>
<path d="M243 104 h17" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="265" y="58" width="215" height="92" rx="10" fill="#161b22" stroke="#30363d"/>
<rect class="box1" x="265" y="58" width="215" height="92" rx="10" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
<text x="281" y="88" class="h">2  Refresh (free)</text>
<text x="281" y="110" class="s">/auth/me  /users  /teams</text>
<path d="M483 104 h17" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="505" y="58" width="215" height="92" rx="10" fill="#161b22" stroke="#30363d"/>
<rect class="box2" x="505" y="58" width="215" height="92" rx="10" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
<text x="521" y="88" class="h">3  Choose</text>
<text x="521" y="110" class="s">first rule that applies</text>
<path d="M723 104 h17" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="745" y="58" width="215" height="92" rx="10" fill="#161b22" stroke="#30363d"/>
<rect class="box3" x="745" y="58" width="215" height="92" rx="10" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
<text x="761" y="88" class="h">4  Act</text>
<rect x="41" y="124" width="183" height="9" rx="4.5" fill="#30363d"/>
<rect class="fill" x="41" y="124" width="183" height="9" rx="4.5" fill="#58a6ff"/>
<text class="act0" x="761" y="116" fill="#7ee787" style="font:600 15px ui-monospace,Consolas,monospace">claim countVowels x3</text>
<text class="act1" x="761" y="116" fill="#79c0ff" style="font:600 15px ui-monospace,Consolas,monospace">defend Rival1x</text>
<text class="act2" x="761" y="116" fill="#7ee787" style="font:600 15px ui-monospace,Consolas,monospace">claim countVowels x3</text>
<text class="act3" x="761" y="116" fill="#ffa657" style="font:600 15px ui-monospace,Consolas,monospace">burst (-3 points)</text>
<path d="M852.5 154 v16 H132.5 v-12" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<text x="500.0" y="184" text-anchor="middle" class="s">one throttled call per slot, forever</text>
<text x="25" y="208" class="s">Choose: the first rule that applies wins the slot</text>
<rect x="25" y="222" width="130" height="38" rx="19" fill="#161b22" stroke="#30363d"/>
<rect class="chip0" x="25" y="222" width="130" height="38" rx="19" fill="#ffa657" fill-opacity="0.18" stroke="#ffa657" stroke-width="2"/>
<text x="90.0" y="246" text-anchor="middle" class="c" fill="#ffa657">1  Burst</text>
<rect x="163" y="222" width="130" height="38" rx="19" fill="#161b22" stroke="#30363d"/>
<rect class="chip1" x="163" y="222" width="130" height="38" rx="19" fill="#79c0ff" fill-opacity="0.18" stroke="#79c0ff" stroke-width="2"/>
<text x="228.0" y="246" text-anchor="middle" class="c" fill="#79c0ff">2  Defend me</text>
<rect x="301" y="222" width="130" height="38" rx="19" fill="#161b22" stroke="#30363d"/>
<text x="366.0" y="246" text-anchor="middle" class="c" fill="#79c0ff">3  Defend teammate</text>
<rect x="439" y="222" width="130" height="38" rx="19" fill="#161b22" stroke="#30363d"/>
<text x="504.0" y="246" text-anchor="middle" class="c" fill="#ff7b72">4  Attack a threat</text>
<rect x="577" y="222" width="130" height="38" rx="19" fill="#161b22" stroke="#30363d"/>
<rect class="chip4" x="577" y="222" width="130" height="38" rx="19" fill="#7ee787" fill-opacity="0.18" stroke="#7ee787" stroke-width="2"/>
<text x="642.0" y="246" text-anchor="middle" class="c" fill="#7ee787">5  Claim</text>
<rect x="715" y="222" width="130" height="38" rx="19" fill="#161b22" stroke="#30363d"/>
<text x="780.0" y="246" text-anchor="middle" class="c" fill="#c9d1d9">6  Discover</text>
<rect x="853" y="222" width="130" height="38" rx="19" fill="#161b22" stroke="#30363d"/>
<text x="918.0" y="246" text-anchor="middle" class="c" fill="#ff7b72">7  Attack (idle)</text>
<text class="why0" x="25" y="298" fill="#c9d1d9" style="font:14px system-ui,-apple-system,Segoe UI,sans-serif">Nothing urgent: claim the best-paying nugget (coefficient x success rate).</text>
<text class="why1" x="25" y="298" fill="#c9d1d9" style="font:14px system-ui,-apple-system,Segoe UI,sans-serif">An attack landed during the wait: throttle is now 4000 ms, so defend first.</text>
<text class="why2" x="25" y="298" fill="#c9d1d9" style="font:14px system-ui,-apple-system,Segoe UI,sans-serif">Back to 3000 ms: claiming again.</text>
<text class="why3" x="25" y="298" fill="#c9d1d9" style="font:14px system-ui,-apple-system,Segoe UI,sans-serif">Three attackers while claiming x3: one burst beats three defends.</text>
</svg>
