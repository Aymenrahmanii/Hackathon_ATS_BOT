[project]
name = "double-trouble"
version = "0.1.0"
description = "Autonomous two-player bot, solver toolkit and offline game replica for the Double Trouble Reloaded hackathon"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = ["requests>=2.31"]

[dependency-groups]
dev = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
